<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e2a" />
      <stop offset="50%" stop-color="#121848" />
      <stop offset="100%" stop-color="#180e38" />
    </linearGradient>

    <!-- Outer Glow / Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#7000ff" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ff007f" stop-opacity="0.9" />
    </linearGradient>

    <!-- Letter A Gradient -->
    <linearGradient id="aGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="45%" stop-color="#0077ff" />
      <stop offset="100%" stop-color="#0033cc" />
    </linearGradient>

    <!-- Pulse Line Gradient -->
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ffe1" />
      <stop offset="50%" stop-color="#00ffff" />
      <stop offset="100%" stop-color="#00bfff" />
    </linearGradient>

    <!-- Pink Dot Glow -->
    <radialGradient id="pinkDot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff3399" />
      <stop offset="70%" stop-color="#ff0066" />
      <stop offset="100%" stop-color="#990033" />
    </radialGradient>

    <!-- Filter for Glows -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Speech Bubble Outer & Inner Container -->
  <path d="M 256 36 C 122 36 16 138 16 264 C 16 318 36 368 72 408 L 38 470 C 33 480 44 490 54 484 L 130 448 C 168 468 211 480 256 480 C 390 480 496 378 496 252 C 496 126 390 36 256 36 Z" fill="url(#ringGrad)" opacity="0.35" filter="url(#glow)"/>
  
  <path d="M 256 46 C 132 46 32 144 32 264 C 32 314 50 360 83 398 L 52 454 L 132 434 C 168 452 210 462 256 462 C 380 462 480 364 480 252 C 480 132 380 46 256 46 Z" fill="url(#bgGrad)" stroke="url(#ringGrad)" stroke-width="5"/>

  <!-- Tech Nodes on Left Side -->
  <g stroke="#00f0ff" stroke-width="3.5" fill="none" opacity="0.95">
    <line x1="120" y1="195" x2="175" y2="225" />
    <circle cx="114" cy="192" r="7" fill="#00f0ff" />
    
    <line x1="95" y1="268" x2="155" y2="268" />
    <circle cx="88" cy="268" r="7" fill="#00f0ff" />

    <line x1="112" y1="340" x2="170" y2="318" />
    <circle cx="106" cy="342" r="7" fill="#00f0ff" />
  </g>

  <!-- Stylized Letter 'A' -->
  <path d="M 256 125 L 358 365 L 312 365 L 290 310 L 222 310 L 200 365 L 154 365 Z M 256 188 L 235 272 L 277 272 Z" fill="url(#aGrad)"/>

  <!-- Pulse / Heartbeat Line through horizontal crossbar -->
  <path d="M 110 282 L 185 282 L 205 282 L 218 245 L 232 320 L 248 215 L 264 315 L 278 282 L 295 282 L 390 282" fill="none" stroke="url(#pulseGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Top Right Glowing Pink/Red Dot Indicator -->
  <circle cx="405" cy="110" r="24" fill="#ffffff" opacity="0.15" />
  <circle cx="405" cy="110" r="18" fill="url(#pinkDot)" filter="url(#glow)"/>
  <circle cx="405" cy="110" r="7" fill="#ffffff" />
</svg>
